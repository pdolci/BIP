{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper d-flex justify-content-center align-items-center">
    <div class="card auth-card p-4" style="max-width: 460px; width: 100%;">
        <h2 class="text-center mb-4"><i class="bi bi-arrow-repeat me-2"></i>Reimposta password</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nuova password</label>
                <input type="password" name="password" class="form-control" minlength="8" maxlength="15" pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[!£$%&^])[A-Za-z\d!£$%&^]{8,15}" title="8-15 caratteri, con almeno una lettera, un numero e un simbolo tra !£$%&^." required>
                <div class="form-text">8-15 caratteri, con almeno una lettera, un numero e un simbolo tra !£$%&^.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Conferma password</label>
                <input type="password" name="confirm_password" class="form-control" minlength="8" maxlength="15" pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[!£$%&^])[A-Za-z\d!£$%&^]{8,15}" title="8-15 caratteri, con almeno una lettera, un numero e un simbolo tra !£$%&^." required>
            </div>
            <button type="submit" class="btn btn-success w-100">Aggiorna password</button>
        </form>
    </div>
</div>
{% endblock %}
