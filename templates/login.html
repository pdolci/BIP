{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper d-flex justify-content-center align-items-center">
    <div class="card auth-card p-4" style="max-width: 430px; width: 100%;">
        <h2 class="text-center mb-4"><i class="bi bi-key me-2"></i>Accedi</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Accedi</button>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('app_routes.register') }}">Non hai un account? Registrati</a>
        </div>
        <div class="text-center mt-2">
            <a href="{{ url_for('app_routes.forgot_password') }}">Password dimenticata?</a>
        </div>
    </div>
</div>
{% endblock %}
