{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper d-flex justify-content-center align-items-center">
    <div class="card auth-card p-4" style="max-width: 430px; width: 100%;">
        <h2 class="text-center mb-4"><i class="bi bi-person-plus me-2"></i>Registrati</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Handle Telegram (opzionale)</label>
                <input type="text" name="telegram_handle" class="form-control" placeholder="es. @mio_handle">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" minlength="8" maxlength="15" pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[!£$%&^])[A-Za-z\d!£$%&^]{8,15}" title="8-15 caratteri, con almeno una lettera, un numero e un simbolo tra !£$%&^." required>
                <div class="form-text">8-15 caratteri, con almeno una lettera, un numero e un simbolo tra !£$%&^.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Crea account</button>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('app_routes.login') }}">Hai già un account? Accedi</a>
        </div>
    </div>
</div>
{% endblock %}
