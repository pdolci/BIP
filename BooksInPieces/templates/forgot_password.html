{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper d-flex justify-content-center align-items-center">
    <div class="card auth-card p-4" style="max-width: 460px; width: 100%;">
        <h2 class="text-center mb-3"><i class="bi bi-shield-lock me-2"></i>Recupera password</h2>
        <p class="text-muted">Inserisci la tua email per ricevere un link di recupero.</p>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Invia link di recupero</button>
        </form>
    </div>
</div>
{% endblock %}
