{% extends "base.html" %}

{% block content %}
<section class="auth-container">
    <div class="glass-card form-card">
        <h2 class="text-center mb-3">Recupera password</h2>
        <p class="text-secondary">Inserisci l'email associata al tuo account: ti invieremo un link per reimpostarla.</p>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Invia link di recupero</button>
        </form>
    </div>
</section>
{% endblock %}
