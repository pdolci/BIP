{% extends "base.html" %}

{% block content %}
<div class="row g-4">
    <div class="col-lg-5">
        <section class="glass-card content-card">
            <h2 class="h4 mb-3">Carica un nuovo libro</h2>
            <form action="{{ url_for('app_routes.upload_book') }}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Titolo</label>
                    <input type="text" name="title" required class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Descrizione breve</label>
                    <textarea name="short_description" rows="3" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">File libro (.txt)</label>
                    <input type="file" name="book_file" required class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100">Carica libro</button>
            </form>
        </section>
    </div>

    <div class="col-lg-7">
        <section class="glass-card content-card">
            <h3 class="h5 mb-3">Catalogo caricato</h3>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Titolo</th>
                            <th>Descrizione</th>
                            <th class="text-end">Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for book in books %}
                            <tr>
                                <td><strong>{{ book.title }}</strong></td>
                                <td>{{ book.short_description or "Nessuna descrizione" }}</td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <form action="{{ url_for('app_routes.toggle_book_status', book_id=book.id) }}" method="post">
                                            <button type="submit" class="btn btn-warning btn-sm">{{ "Disattiva" if book.is_active else "Attiva" }}</button>
                                        </form>
                                        <form action="{{ url_for('app_routes.delete_book', book_id=book.id) }}" method="post">
                                            <button type="submit" class="btn btn-danger btn-sm">Elimina</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>
{% endblock %}
