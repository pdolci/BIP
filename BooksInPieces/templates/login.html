{% extends "base.html" %}

{% block content %}
<section class="auth-container">
    <div class="glass-card form-card">
        <h2 class="text-center mb-4">Accedi</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entra</button>
        </form>
        <div class="text-center mt-4 d-grid gap-2">
            <a class="muted-link" href="{{ url_for('app_routes.forgot_password') }}">Password dimenticata?</a>
            <a class="muted-link" href="{{ url_for('app_routes.register') }}">Non hai un account? Registrati</a>
        </div>
    </div>
</section>
{% endblock %}
